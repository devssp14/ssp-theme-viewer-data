<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSP Theme Studio</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;

    .card {
      max-width: 420px;

      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>SSP Theme Studio</h2>
    <p>Open this link in SSP Theme Studio on your Android device to view this theme or icon pack.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.sspdesign.themestudio">Get SSP Theme Studio on Google Play</a>
  </div>
</body>
</html>
